[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".pytest_cache", "data"]

[tool.ruff.lint]
# 聚焦真实错误：F=未用/未定义/重定义，E/W=风格一致，I=导入排序
select = ["E", "F", "W", "I"]
# 行宽不强制（业务长注释/字符串多），不强制 tz 注解
ignore = ["E501", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
# 全量扫描 app 目录，持续保障数据计算与 Web 视图的类型安全性
files = ["app"]
# sqlite3.Row 在类型桩里不算 Sequence，业务代码到处 row["x"]，不为此加 cast
disable_error_code = ["index", "union-attr"]
# 第三方库（flask/openpyxl 等）没桩不报
ignore_missing_imports = true
# 不强制函数都加注解；只校验已有的
check_untyped_defs = false