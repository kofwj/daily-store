[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".pytest_cache", "data"]

[tool.ruff.lint]
# 聚焦真实错误：F=未用/未定义/重定义，E/W=风格一致，I=导入排序
select = ["E", "F", "W", "I"]
# 行宽不强制（业务长注释/字符串多），不强制 tz 注解
ignore = ["E501", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.9"
# 只盯算钱的三个模块 + 它们的直接依赖，防类型错误静默变成错数字
files = [
    "app/metrics_seed.py",
    "app/db_advances.py",
    "app/insights.py",
    "app/db_core.py",
    "app/db_policies.py",
]
# sqlite3.Row 在类型桩里不算 Sequence，业务代码到处 row["x"]，不为此加 cast
disable_error_code = ["index", "union-attr"]
# 第三方库（flask/openpyxl 等）没桩不报
ignore_missing_imports = true
# 不强制函数都加注解；只校验已有的
check_untyped_defs = false