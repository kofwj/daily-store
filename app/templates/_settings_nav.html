<aside class="settings-nav">
  <div class="settings-nav-brand">
    <strong>设置</strong>
    <span class="muted">{% if g.user['role'] == 'admin' %}账号 · 业务 · 系统{% else %}个人账号{% endif %}</span>
  </div>
  <div class="settings-nav-group">
    <span class="settings-nav-label">个人</span>
    <a href="{{ url_for('settings', tab='account') }}" class="{{ 'active' if tab=='account' else '' }}">我的账号</a>
  </div>
  {% if g.user['role'] == 'admin' and not g.user['must_change_pin'] %}
  <div class="settings-nav-group">
    <span class="settings-nav-label">组织</span>
    <a href="{{ url_for('settings', tab='people') }}" class="{{ 'active' if tab=='people' else '' }}">人员账号</a>
    <a href="{{ url_for('settings', tab='stores') }}" class="{{ 'active' if tab=='stores' else '' }}">门店档案</a>
  </div>
  <div class="settings-nav-group">
    <span class="settings-nav-label">业务</span>
    <a href="{{ url_for('settings', tab='targets') }}" class="{{ 'active' if tab=='targets' else '' }}">月目标</a>
    <a href="{{ url_for('settings', tab='rules') }}" class="{{ 'active' if tab=='rules' else '' }}">考核规则</a>
    <a href="{{ url_for('settings', tab='broadcast') }}" class="{{ 'active' if tab=='broadcast' else '' }}">播报</a>
    <a href="{{ url_for('settings', tab='review') }}" class="{{ 'active' if tab=='review' else '' }}">复盘模板</a>
    <a href="{{ url_for('settings', tab='invoice') }}" class="{{ 'active' if tab=='invoice' else '' }}">开票主体</a>
    <a href="{{ url_for('settings', tab='permissions') }}" class="{{ 'active' if tab=='permissions' else '' }}">权限</a>
  </div>
  <div class="settings-nav-group">
    <span class="settings-nav-label">系统</span>
    <a href="{{ url_for('edits_page') }}" class="{{ 'active' if tab=='edits' else '' }}">修改审计</a>
    <a href="{{ url_for('logins_page') }}" class="{{ 'active' if tab=='logins' else '' }}">登录日志</a>
    <a href="{{ url_for('settings', tab='brand') }}" class="{{ 'active' if tab=='brand' else '' }}">登录页</a>
    <a href="{{ url_for('settings', tab='backup') }}" class="{{ 'active' if tab=='backup' else '' }}">备份恢复</a>
  </div>
  {% endif %}
</aside>
