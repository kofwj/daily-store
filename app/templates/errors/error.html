{% extends "base.html" %}
{% block title %}{{ title }} · 门店日报{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block body %}
<div class="card error-card">
  <div class="error-code">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="error-actions">
    <a class="btn" href="{{ url_for('today') if g.user else url_for('login') }}">← 回到首页</a>
    <button class="btn ghost" onclick="location.reload()">刷新重试</button>
  </div>
</div>
{% endblock %}
