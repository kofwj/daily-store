name: store-daily

services:
  app:
    build: .
    environment:
      TZ: Asia/Shanghai
      STORE_DAILY_DB: /app/data/store_daily.db
      STORE_DAILY_DATA: /app/data
      STORE_DAILY_SECRET: ${STORE_DAILY_SECRET:?set STORE_DAILY_SECRET in .env}
      STORE_DAILY_SECURE: ${STORE_DAILY_SECURE:?set STORE_DAILY_SECURE=1 for TLS/Cloudflare; explicit 0 only for LAN HTTP}
      STORE_DAILY_TRUST_PROXY: ${STORE_DAILY_TRUST_PROXY:-1}
      STORE_DAILY_LOCK_HOUR: ${STORE_DAILY_LOCK_HOUR:-23}
      STORE_DAILY_LOCK_MINUTE: ${STORE_DAILY_LOCK_MINUTE:-0}
    volumes:
      - ./data:/app/data
      - ./app/stores_seed_local.py:/app/app/stores_seed_local.py:ro
    expose:
      - "5055"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      # 默认只绑本机。局域网明文 HTTP 必须显式设 CADDY_BIND=0.0.0.0 且接受口令裸奔风险。
      # 优先 CADDYFILE=./caddy/Caddyfile.tunnel + Cloudflare/TLS。
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_PORT:-8099}:80"
    volumes:
      - ${CADDYFILE:-./caddy/Caddyfile.tunnel}:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
